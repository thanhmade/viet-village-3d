<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>VIET VILLAGE — Admin</title><style>body{font:16px system-ui;background:#101c2a;color:#eef5ff;padding:28px;max-width:900px;margin:auto}section{background:#1e3043;padding:22px;border-radius:14px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #607087;text-align:left}</style><h1>VIET VILLAGE 3D — Quản trị</h1><p>Bảng đọc dữ liệu, chưa hỗ trợ sửa tài khoản. Chỉ dành cho admin.</p><section><h2>Tổng quan</h2><pre id="overview">Đang tải...</pre></section><section><h2>Tài khoản (tối đa 100)</h2><table><thead><tr><th>Email</th><th>Vai trò</th><th>Xác minh</th><th>Khóa</th></tr></thead><tbody id="users"></tbody></table></section><script>async function run(){for(const [url,id] of [['/admin/api/overview','overview'],['/admin/api/users','users']]){const r=await fetch(url,{credentials:'same-origin'});if(!r.ok)throw Error('HTTP '+r.status);const v=await r.json();if(id==='overview')document.getElementById(id).textContent=JSON.stringify(v,null,2);else for(const u of v.users){const tr=document.createElement('tr');for(const val of [u.email,u.role,u.email_verified?'Có':'Chưa',u.disabled?'Có':'Không']){const td=document.createElement('td');td.textContent=val;tr.append(td)}document.getElementById(id).append(tr)}}}run().catch(e=>document.getElementById('overview').textContent='Lỗi: '+e.message)</script></html>
