<script type="module">
import {GLTFLoader} from '../ASSETS/vendor/gltf-r160/GLTFLoader.js';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),T=window.THREE;
try{
 const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;document.body.appendChild(renderer.domElement);
 const scene=new T.Scene();scene.background=new T.Color('#111c1c');scene.fog=new T.Fog('#111c1c',14,38);
 const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,80);camera.position.set(11,4.5,10);camera.lookAt(0,1.1,4.5);
 scene.add(new T.HemisphereLight(0xb5d9c8,0x30362a,1.5));const key=new T.DirectionalLight(0xffe0a1,2.6);key.position.set(4,7,2);scene.add(key);const rim=new T.DirectionalLight(0x67d8c0,2);rim.position.set(-4,4,-4);scene.add(rim);
 const ground=new T.Mesh(new T.PlaneGeometry(90,90),new T.MeshStandardMaterial({color:0x343b32,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);
 const tiles=new T.InstancedMesh(new T.BoxGeometry(.88,.045,.88),new T.MeshStandardMaterial({color:0x42473c,roughness:.95}),225),d=new T.Object3D();let n=0;
 for(let x=-7;x<=7;x++)for(let z=-7;z<=7;z++){d.position.set(x*.94,-.025,z*.94);d.updateMatrix();tiles.setMatrixAt(n++,d.matrix);}scene.add(tiles);
 const actor=new T.Group();scene.add(actor);const gender=q.get('gender')==='female'?'FEMALE':'MALE';$('gender').value=gender.toLowerCase();
 const gltf=await new GLTFLoader().loadAsync('../CHARACTERS/PLAYER/'+gender+'/PLAYER_BASE_'+gender+'_GLB.glb');
 const visual=createVillagePlayerGLTFVisual({THREE:T,gltf,height:2.35,modelId:gender.toLowerCase()+'-base'});actor.add(visual.root);visual.update(0);
 const models=createVillageWeaponModels(T),model=models.models.get('bow'),grip=models.root;for(const item of models.models.values())if(item!==model)item.group.removeFromParent();
 visual.sockets.right.add(grip);grip.scale.setScalar(.7);grip.rotation.y=Math.PI;grip.position.copy(model.gripPoint||new T.Vector3()).multiplyScalar(-.7).applyQuaternion(grip.quaternion);model.group.visible=true;
 const caster=new T.Object3D();caster.rotation.y=Math.PI;actor.add(caster);const skill=BowSkillConfig.skills.find(s=>s.id==='bow.xuyen-tien');
 const wallBox=new T.Box3(new T.Vector3(-.8,0,8),new T.Vector3(.8,2.8,8.35));const wall=new T.Mesh(new T.BoxGeometry(1.6,2.8,.35),new T.MeshStandardMaterial({color:0x536477,roughness:.95}));wall.position.set(0,1.4,8.175);scene.add(wall);
 const targets=[[-.12,3],[-.12,5.5],[-.12,10]].map(([x,z],i)=>{const mat=new T.MeshStandardMaterial({color:0x926d43,roughness:.9});const mesh=new T.Mesh(new T.CylinderGeometry(.17,.23,1.9,8),mat);mesh.position.set(x,.95,z);scene.add(mesh);return {id:'preview-target-'+i,point:new T.Vector3(x,0,z),mesh,mat,hit:false};});
 let vfx,clock=0,castAt=-99,paused=q.has('test'),last=0,shake=0,audio=null;const events=[];
 function sound(){if(!$('sound').checked)return;audio??=new(window.AudioContext||window.webkitAudioContext)();void audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(110,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(38,audio.currentTime+.22);gain.gain.setValueAtTime(.18,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.32);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.34);}
 function reset(){vfx?.dispose();visual.returnToIdle();model.setDraw(0,true);clock=0;castAt=-99;shake=0;events.length=0;for(const t of targets){t.hit=false;t.mat.color.setHex(0x926d43);}vfx=new WeaponVFXCore({THREE:T,scene,quality:$('quality').value,getGroundY:()=>0,onEvent:e=>{events.push({type:e.type,time:clock});if(e.type==='impact'){shake=.025;try{sound();}catch(_){}}if(e.type==='hit-window')for(const target of targets)if(e.testTarget(target.id,target.point,.23)){target.hit=true;target.mat.color.setHex(0x65e6bb);}}});render();}
 function cast(){if(vfx.effects.length)return {ok:false,reason:'busy'};const r=vfx.cast(skill.id,{caster,weapon:model.group,weaponTip:model.tip,casterHeight:2.35});if(r.ok){castAt=clock;visual.startBowDraw();vfx.effects.find(f=>f.handle===r.handle).bow.trace=(a,b,radius)=>BowPiercing.traceWorld(T,a,b,radius,[wallBox],()=>0);}render();return r;}
 function render(){const age=Math.max(0,clock-castAt),phase=castAt<-90?'Sẵn sàng':BowPiercing.sample(age).phase;$('status').textContent=phase+' · t = '+(castAt>-90?age.toFixed(2):'0.00')+' s · Trúng bia: '+targets.filter(t=>t.hit).length+'/'+targets.length+' · Hồi: '+vfx.cooldownRemaining(skill.id,caster).toFixed(1)+' s';$('cast').disabled=vfx.cooldownRemaining(skill.id,caster)>0||vfx.effects.length>0;$('pause').textContent=paused?'Tiếp tục':'Tạm dừng';renderer.render(scene,camera);}
 function step(dt){clock+=dt;visual.update(dt);const age=clock-castAt;model.setDraw(BowPiercing.sample(age).draw,age<skill.activeAt||age>=BowPiercing.poseDuration);vfx.update(dt);shake*=Math.exp(-11*dt);if($('orbit').checked){camera.position.set(11,2.4+Math.sin(clock*51)*shake,4.4);camera.lookAt(0,1.6,4.4);}else{camera.position.set(11,4.5,10);camera.lookAt(0,1.1,4.5);}render();}
 reset();$('cast').onclick=cast;$('reset').onclick=reset;$('cancel').onclick=()=>{vfx.cancelAll();visual.returnToIdle();model.setDraw(0,true);castAt=-99;render();};$('pause').onclick=()=>{paused=!paused;render();};$('step').onclick=()=>{paused=true;step(.05);};$('quality').onchange=reset;$('gender').onchange=()=>{q.set('gender',$('gender').value);location.search=q.toString();};for(const id of ['cancel','reset','pause','step'])$(id).disabled=false;
 addEventListener('keydown',e=>{if(e.repeat||['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(['Digit1','KeyJ'].includes(e.code))cast();});addEventListener('blur',()=>{paused=true;render();});
 addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();render();});
 window.xuyenTienPreview={scene,renderer,camera,actor,visual,reset,cast,step,events,get vfx(){return vfx;}};window.ready=true;
 function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!paused&&!document.hidden)step(dt);requestAnimationFrame(frame);}requestAnimationFrame(frame);
}catch(error){$('status').textContent='Chưa mở được bản thử: '+error.message;window.previewError=error.message;console.error(error);}
</script></body></html>
