<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hộ Thân · Côn · Làng Việt 3D</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#101b20;color:#f0e6cf;font-family:system-ui,sans-serif}canvas{display:block}header{position:absolute;top:28px;left:36px;pointer-events:none}header p{font-size:11px;letter-spacing:.24em;color:#96c9b6}h1{font-family:Georgia,serif;font-size:46px;letter-spacing:.1em;margin:10px 0}header small{color:#b4bfb7;font-size:13px}.panel{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(680px,90vw);text-align:center;background:#122226e8;border:1px solid #53635a;border-radius:15px;padding:17px;box-sizing:border-box}#readout{font-size:14px;color:#cfdfd6;margin-bottom:13px}button,select{background:#253b3b;color:#f1e5be;border:1px solid #647668;border-radius:7px;padding:10px 14px;margin:3px;cursor:pointer;font:inherit;font-size:13px}button:hover{background:#35544e}button:disabled{opacity:.45;cursor:default}.hint{font-size:11px;color:#98aaa2;margin:10px 0 0}.error{position:absolute;inset:25%;color:#ffba9e;white-space:pre-wrap}@media(max-width:600px){header{left:20px;top:12px}h1{font-size:32px}.panel{bottom:12px;padding:12px}}</style></head>
<body><header><p>LÀNG VIỆT 3D / CÔN</p><h1>HỘ THÂN</h1><small>Tụ khí · hộ thể · chấn động · tán khí</small></header>
<div class="panel"><div id="readout" role="status">Đang tải nhân vật…</div><button id="cast" disabled>2 · Hộ Thân</button><button id="hit" disabled>H · Đòn 12</button><button id="break" disabled>B · Đòn 40</button><button id="reset" disabled>Làm lại</button><select id="quality" aria-label="Chất lượng"><option value="low">Nhẹ</option><option value="medium" selected>Vừa</option><option value="high">Cao</option></select><label><input type="checkbox" id="orbit">Camera giới thiệu</label><p class="hint">WASD: di chuyển · Lá chắn thử nghiệm: 30 HP · Hiệu ứng từ mã game, dùng nhân vật và Côn hiện có.</p></div>
<script src="../ASSETS/vendor/three.min.js"></script><script src="js/vfx/weapon-vfx-core.js"></script><script src="js/vfx/staff-skill-config.js"></script><script src="js/vfx/staff-vfx-config.js"></script><script src="js/vfx/staff-skill-effects.js"></script><script src="js/staff-guard.js"></script><script src="js/player-journey.js"></script><script src="../CHARACTERS/npc-gltf.js"></script><script src="../CHARACTERS/player-gltf.js"></script><script src="js/weapons-village-models.js"></script>
<script type="module">
import {GLTFLoader} from '../ASSETS/vendor/gltf-r160/GLTFLoader.js';
try {
 const T=window.THREE,$=id=>document.getElementById(id),query=new URLSearchParams(location.search);
 const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
 const scene=new T.Scene();scene.background=new T.Color('#101b20');scene.fog=new T.Fog('#101b20',12,30);
 const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,60);camera.position.set(4.3,2.9,6.5);camera.lookAt(0,1.05,0);
 scene.add(new T.HemisphereLight(0xb9dedb,0x343a32,1.4));const key=new T.DirectionalLight(0xffe3b1,2.8);key.position.set(3,6,4);scene.add(key);const rim=new T.DirectionalLight(0x71d9bc,2.2);rim.position.set(-3,3,-4);scene.add(rim);
 const ground=new T.Mesh(new T.PlaneGeometry(70,70),new T.MeshStandardMaterial({color:0x293432,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;scene.add(ground);
 const stone=new T.MeshStandardMaterial({color:0x394541,roughness:.95});for(let i=0;i<24;i++){const a=i/24*Math.PI*2,m=new T.Mesh(new T.BoxGeometry(.9,.08,.45),stone);m.position.set(Math.sin(a)*4.3,-.02,Math.cos(a)*4.3);m.rotation.y=a;scene.add(m);}
 const actor=new T.Group();scene.add(actor);const gender=query.get('gender')==='female'?'FEMALE':'MALE';const gltf=await new GLTFLoader().loadAsync('../CHARACTERS/PLAYER/'+gender+'/PLAYER_BASE_'+gender+'_GLB.glb');
 const visual=createVillagePlayerGLTFVisual({THREE:T,gltf,height:2.35,modelId:gender.toLowerCase()+'-base'});actor.add(visual.root);visual.update(0);
 const models=createVillageWeaponModels(T),model=models.models.get('staff'),grip=models.root;for(const item of models.models.values())if(item!==model)item.group.removeFromParent();
 visual.sockets.right.add(grip);grip.scale.setScalar(.7);grip.rotation.y=Math.PI;grip.position.copy(model.gripPoint||new T.Vector3()).multiplyScalar(-.7).applyQuaternion(grip.quaternion);model.group.visible=true;
 const caster=new T.Object3D();caster.rotation.y=Math.PI;actor.add(caster);WeaponVFXCore.registerWeapon(StaffSkillConfig);
 const skill=StaffSkillConfig.skills.find(s=>s.id==='staff.ho-than'),guard=createStaffGuard(),events=[],keys=new Set();let vfx,clock=0,last=0,handle=null;
 const health=createVillageJourney({getIdentity:()=>({authenticated:true,uid:'preview'}),mitigateDamage:({amount})=>{const hit=guard.absorb(amount,'preview');if(hit.absorbed){const pos=actor.position.clone().add(new T.Vector3(1.4,1.4,1));vfx.hitShield(caster,pos);if(hit.broken)vfx.endShield(hit.handle,'depleted');}return hit.damage;}});
 function reset(){vfx?.dispose();guard.cancel();events.length=0;health.setCharacterState({alive:true,hp:100});actor.position.set(0,0,0);visual.returnToIdle();clock=0;vfx=new WeaponVFXCore({THREE:T,scene,quality:$('quality').value,getGroundY:()=>0,onEvent:e=>events.push(e.type)});}
 function cast(){const result=vfx.cast(skill.id,{caster,weapon:model.group,weaponTip:model.tip,casterHeight:2.35});if(result.ok){handle=result.handle;guard.start(skill,{maxHp:100,ownerId:'preview',handle});const s=StaffVFXConfig.animation[skill.id];visual.playSegment(s.clip,{from:s.from,to:s.to,force:true});}return result;}
 function hit(amount=12){health.takeDamage(amount);if(!health.getState().alive){guard.cancel();vfx.cancelAll();}render();}
 function render(){const g=guard.state,cd=vfx.cooldownRemaining(skill.id,caster);$('readout').textContent='HP '+health.getState().hp+'/100  ·  '+(g?.active?'Hộ thể '+Math.ceil(g.remaining)+'/30':g?'Đang tụ khí…':'Không có lá chắn')+'  ·  Hồi chiêu '+cd.toFixed(1)+' s';$('cast').disabled=cd>0||!health.getState().alive;renderer.render(scene,camera);}
 function step(dt){clock+=dt;const x=Number(keys.has('KeyD'))-Number(keys.has('KeyA')),z=Number(keys.has('KeyS'))-Number(keys.has('KeyW'));const length=Math.hypot(x,z);if(length&&health.getState().alive){actor.position.x+=x/length*dt*2;actor.position.z+=z/length*dt*2;}visual.setLocomotion(length?2:0);visual.update(dt);guard.advance(dt);vfx.update(dt);if($('orbit').checked){camera.position.set(Math.sin(clock*.22+.58)*7.8,2.9,Math.cos(clock*.22+.58)*7.8);camera.lookAt(actor.position.x,1.05,actor.position.z);}render();}
 reset();$('cast').onclick=cast;$('hit').onclick=()=>hit(12);$('break').onclick=()=>hit(40);$('reset').onclick=()=>{reset();render();};$('quality').onchange=()=>{reset();cast();};for(const id of ['hit','break','reset'])$(id).disabled=false;
 addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName)||e.repeat)return;keys.add(e.code);if(e.code==='Digit2')cast();if(e.code==='KeyH')hit(12);if(e.code==='KeyB')hit(40);});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();guard.cancel();vfx.cancelAll();});
 addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();render();});
 window.preview={reset,cast,hit,step,render,renderer,scene,camera,actor,visual,guard,health,get vfx(){return vfx;},events};window.ready=true;render();
 function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!query.has('test')&&!document.hidden)step(dt);requestAnimationFrame(frame);}requestAnimationFrame(frame);
}catch(e){document.getElementById('readout').textContent='Không tải được bản xem thử: '+e.message;window.previewError=e.message;console.error(e);}
</script></body></html>
