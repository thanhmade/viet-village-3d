<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#09131c;color:#edf1e9;--accent:#ebc779}*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{display:block}button,select{font:inherit}button,select,input{accent-color:var(--accent)}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #a3efdd;outline-offset:4px}header{position:absolute;top:26px;left:32px;pointer-events:none;z-index:2}header p{color:#a4c3c2;letter-spacing:.23em;font-size:11px;margin:0 0 12px}h1{font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;font-size:42px;letter-spacing:.055em;margin:0 0 8px;color:#ffe0a0;text-shadow:0 2px 20px #000}header small{display:block;color:#c4d3ce;font-size:12px;max-width:440px;line-height:1.6}.duration{display:inline-block;color:#f3cd81;margin-left:10px;border-left:1px solid #73887c;padding-left:12px;font:500 18px system-ui,sans-serif;letter-spacing:0;vertical-align:middle}.panel{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:min(850px,96vw);padding:12px 17px;border:1px solid #6b705480;border-radius:14px;background:linear-gradient(145deg,#112427f2,#112024f2);box-shadow:0 12px 50px #0008;text-align:center;z-index:3}.skills{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 0 10px}.skill{display:flex;align-items:center;gap:9px;border:1px solid #60747760;background:#15272a;color:#c6d5d2;border-radius:9px;padding:5px 13px 5px 5px;cursor:pointer;text-align:left;min-width:154px}.skill[aria-pressed="true"]{border-color:var(--accent);background:#354132;color:#ffe2a5;box-shadow:0 0 20px #d9bc5c15}.skill img{width:46px;height:46px;object-fit:cover;border-radius:50%;border:1px solid #d4b36c70}.skill strong{font-size:13px;font-weight:600}.skill small{display:block;color:#a7bab3;font-size:10px;margin-top:3px;letter-spacing:.06em}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}button.action,select{font-size:12px;background:#233a3c;color:#f3e9d1;border:1px solid #617871;border-radius:5px;padding:7px 10px;cursor:pointer}button.action.primary{color:#142624;background:#e4c879;border-color:#f3dea0;font-weight:700;min-width:115px}button:disabled{opacity:.43;cursor:default}label{font-size:11px;color:#bccfc8;white-space:nowrap}#status{font-size:12px;margin:0 0 9px;color:#c8e4d7;min-height:17px}.hint{font-size:10px;color:#94aaa5;line-height:1.5;margin:9px 0 0}.phase{position:absolute;right:28px;bottom:228px;text-align:right;pointer-events:none;z-index:2}#phase{font:22px Georgia,serif;color:#e7d7aa;text-transform:uppercase;letter-spacing:.06em}#clock{font-size:12px;color:#93aca8;margin-top:6px;font-variant-numeric:tabular-nums}details{position:absolute;right:24px;top:26px;background:#102225e8;border:1px solid #526b655e;padding:9px 12px;border-radius:7px;font-size:11px;max-width:37vw;z-index:4;color:#b7c9c2}summary{cursor:pointer}details img{display:block;width:380px;max-width:100%;margin-top:9px;border-radius:3px}.capture .panel,.capture details{display:none}.capture .phase{bottom:30px}.capture header{top:30px;left:32px}@media(max-width:650px){header{top:16px;left:16px}header p{font-size:9px;margin-bottom:8px}h1{font-size:28px}.duration{font-size:14px}header small{font-size:10px;max-width:270px}details{right:12px;top:16px;max-width:29vw}.panel{padding:10px 8px;bottom:8px}.skills{gap:7px}.skill{min-width:0;flex:1;justify-content:center;gap:5px;padding:4px}.skill img{width:36px;height:36px}.skill strong{font-size:10px}.skill small{font-size:9px}.row{gap:5px}button.action,select{font-size:10px;padding:6px}.hint{font-size:9px}.phase{right:16px;bottom:247px}#phase{font-size:17px}#status{font-size:10px}}

<header><p>LÀNG VIỆT 3D / THƯƠNG · GIÁO</p><h1><span id="title">Xuyên Kích</span><span class="duration" id="duration">2,6 s</span></h1><small id="subtitle">Hạ tấn · tụ khí · đâm thẳng · thu thương</small></header>
<details><summary>Ảnh tham chiếu</summary><img id="reference" src="docs/thuong-giao/xuyen-kich-reference.png" alt="Ảnh Xuyên Kích do người dùng cung cấp"></details>
<div class="phase"><div id="phase">Sẵn sàng</div><div id="clock">00,00 / 02,60 s</div></div>
<div class="panel">
 <div class="skills" aria-label="Chọn chiêu thức">
  <button class="skill" data-skill="xuyen-kich" aria-pressed="true" disabled><img src="../ASSETS/ui/skills/spear/xuyen-kich-gold.png" alt=""><span><strong>Xuyên Kích</strong><small>1 · 2,6 GIÂY</small></span></button>
  <button class="skill" data-skill="thuong-phong" aria-pressed="false" disabled><img src="../ASSETS/ui/skills/spear/thuong-phong-jade.png" alt=""><span><strong>Thương Phong</strong><small>2 · 3,2 GIÂY</small></span></button>
  <button class="skill" data-skill="pha-tran" aria-pressed="false" disabled><img src="../ASSETS/ui/skills/spear/pha-tran-gold.png" alt=""><span><strong>Phá Trận</strong><small>3 · 4,2 GIÂY</small></span></button>
 </div>
 <div id="status" role="status">Đang tải nhân vật…</div>
 <div class="row"><button class="action primary" id="cast" disabled>Thi triển</button><button class="action" id="cancel" disabled>Hủy chiêu</button><button class="action" id="reset" disabled>Đặt lại</button><button class="action" id="pause" disabled>Tạm dừng</button><button class="action" id="step" disabled>+0,05 s</button>
 <select id="gender" aria-label="Nhân vật"><option value="male">Nhân vật nam</option><option value="female">Nhân vật nữ</option></select>
 <select id="quality" aria-label="Chất lượng"><option value="low">Nhẹ</option><option value="medium" selected>Vừa</option><option value="high">Cao</option></select>
 <select id="scenario" aria-label="Tình huống"><option value="hit">Bia phía trước · 3,5 m</option><option value="miss">Sân trống</option><option value="wall">Vách sát người · 1 m</option><option value="wall-behind">Vách sau bia</option><option value="fan">Ba bia phía trước</option><option value="rear">Bia sau lưng</option></select>
 <label><input id="orbit" type="checkbox">Góc bên hông</label></div>
 <p class="hint">Nhân vật và hiệu ứng chạy bằng mã game. Phím 1–3 chọn chiêu, J thi triển. Trang xem thử có sân tập và camera riêng.</p>
</div>

<script src="../CHARACTERS/npc-gltf.js"></script><script src="../CHARACTERS/player-gltf.js?v=thuong-giao-1"></script><script src="js/weapons-village-models.js"></script>
<script type="module">
import {GLTFLoader} from '../ASSETS/vendor/gltf-r160/GLTFLoader.js';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),T=window.THREE;
const labels={
 'xuyen-kich':{name:'Xuyên Kích',subtitle:'Hạ tấn · nén khí vàng · đâm thẳng · thu thương',accent:'#ebc779'},
 'thuong-phong':{name:'Thương Phong',subtitle:'Xoay hông · quét ngang · phong nhận xanh ngọc · hồi thế',accent:'#8ce4cf'},
 'pha-tran':{name:'Phá Trận',subtitle:'Trụ tấn · xoay thương · khí xoắn vàng · dư chấn mặt đất',accent:'#edc477'}
};
try{
 const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
 const scene=new T.Scene();scene.background=new T.Color('#09131c');scene.fog=new T.Fog('#09131c',15,34);
 const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,70);
 function fitCamera(){camera.aspect=innerWidth/innerHeight;camera.fov=T.MathUtils.radToDeg(2*Math.atan(Math.tan(T.MathUtils.degToRad(20))*Math.max(1,1.6/camera.aspect)));camera.updateProjectionMatrix();}fitCamera();
 scene.add(new T.HemisphereLight(0xbfdde9,0x29313c,1.6));const key=new T.DirectionalLight(0xffe2b3,2.6);key.position.set(-3,7,5);scene.add(key);const rim=new T.DirectionalLight(0x78bcda,2.1);rim.position.set(4,5,-4);scene.add(rim);
 const ground=new T.Mesh(new T.PlaneGeometry(70,70),new T.MeshStandardMaterial({color:0x27363b,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.055;scene.add(ground);
 const tiles=new T.InstancedMesh(new T.BoxGeometry(.92,.045,.92),new T.MeshStandardMaterial({color:0x34454b,roughness:.94}),357),dummy=new T.Object3D();let tileIndex=0;
 for(let x=-8;x<=8;x++)for(let z=-7;z<=13;z++){dummy.position.set(x*.97,-.028,z*.97);dummy.updateMatrix();tiles.setMatrixAt(tileIndex++,dummy.matrix);}scene.add(tiles);
 const borderMat=new T.MeshStandardMaterial({color:0x566064,roughness:1});
 for(const x of [-7.6,7.6])for(const z of [-4,1,6,11]){const plinth=new T.Mesh(new T.BoxGeometry(.68,.32,.68),borderMat);plinth.position.set(x,.14,z);scene.add(plinth);const post=new T.Mesh(new T.CylinderGeometry(.17,.23,1.45,8),borderMat);post.position.set(x,.95,z);scene.add(post);}
 const actor=new T.Group();scene.add(actor);const gender=q.get('gender')==='female'?'FEMALE':'MALE';$('gender').value=gender.toLowerCase();
 const gltf=await new GLTFLoader().loadAsync('../CHARACTERS/PLAYER/'+gender+'/PLAYER_BASE_'+gender+'_GLB.glb');
 const visual=createVillagePlayerGLTFVisual({THREE:T,gltf,height:2.35,modelId:gender.toLowerCase()+'-base'});actor.add(visual.root);visual.update(0);
 const models=createVillageWeaponModels(T),model=models.models.get('spear'),grip=models.root;for(const item of models.models.values())if(item!==model)item.group.removeFromParent();
 visual.sockets.right.add(grip);grip.scale.setScalar(.7);grip.rotation.y=Math.PI;grip.position.copy(model.gripPoint).multiplyScalar(-.7).applyQuaternion(grip.quaternion);model.group.visible=true;
 const caster=new T.Object3D();caster.rotation.y=Math.PI;actor.add(caster);
 const closeWall=new T.Box3(new T.Vector3(-3,0,.9),new T.Vector3(3,3,1.1)),farWall=new T.Box3(new T.Vector3(-3,0,4.7),new T.Vector3(3,3,4.9));
 const wall=new T.Mesh(new T.BoxGeometry(6,3,.2),new T.MeshStandardMaterial({color:0x566776,roughness:.95}));scene.add(wall);
 const targets=[[0,3.5],[-1.8,2.5],[1.8,2.5],[0,-3.5]].map(([x,z],i)=>{const mat=new T.MeshStandardMaterial({color:0xb38753,roughness:.9}),group=new T.Group();group.position.set(x,0,z);const trunk=new T.Mesh(new T.CylinderGeometry(.23,.27,1.85,10),mat);trunk.position.y=.925;group.add(trunk);const arm=new T.Mesh(new T.CylinderGeometry(.075,.075,.85,8),mat);arm.rotation.z=Math.PI/2;arm.position.y=1.25;group.add(arm);const base=new T.Mesh(new T.CylinderGeometry(.4,.46,.1,12),borderMat);base.position.y=.025;group.add(base);scene.add(group);return {id:'spear-preview-target-'+i,point:new T.Vector3(x,0,z),mesh:group,mat,hits:0};});
 let vfx,clock=0,castAt=-99,paused=q.has('test'),last=0,shake=0,skill;const events=[];
 const initial=q.get('skill')?.replace(/^spear\./,'');let selected=labels[initial]?initial:'xuyen-kich';
 if(['low','medium','high'].includes(q.get('quality')))$('quality').value=q.get('quality');
 if([...$('scenario').options].some(o=>o.value===q.get('scenario')))$('scenario').value=q.get('scenario');
 if(q.has('capture'))document.body.classList.add('capture');
 function cameraPose(){if($('orbit').checked){camera.position.set(-9,3.15,1.3);camera.lookAt(0,1.05,1.3);}else{camera.position.set(-7.8,4.0,7);camera.lookAt(0,.9,1.2);}camera.position.y+=Math.sin(clock*49)*shake;}
 function reset(){vfx?.dispose();visual.returnToIdle();visual.update(0);clock=0;castAt=-99;shake=0;events.length=0;const scenario=$('scenario').value;wall.visible=['wall','wall-behind'].includes(scenario);wall.position.set(0,1.5,scenario==='wall'?1:4.8);for(const [i,t] of targets.entries()){t.hits=0;t.mat.color.setHex(0xb38753);t.mesh.visible=scenario==='fan'?i<3:scenario==='rear'?i===3:scenario!=='miss'&&i===0;}vfx=new WeaponVFXCore({THREE:T,scene,quality:$('quality').value,getGroundY:()=>0,onEvent:e=>{events.push({type:e.type,time:clock,hitIndex:e.hitIndex,targetId:e.targetId,contactKind:e.contactKind});if(e.type==='impact'||e.type==='ground-pulse')shake=Math.min(.035,Number(e.shake)||.018);if((e.type==='target-query'||e.type==='hit-window')&&typeof e.testTarget==='function')for(const target of targets)if(target.mesh.visible&&e.testTarget(target.id,target.point,.27,1.85)){target.hits++;target.mat.color.setHex(0x8bdebe);}}});cameraPose();render();}
 function selectSkill(value){const local=String(value).replace(/^spear\./,'');if(!labels[local])return false;selected=local;skill=SpearSkillConfig.skills.find(item=>item.id==='spear.'+local);const label=labels[local];$('title').textContent=label.name;$('duration').textContent=skill.duration.toFixed(1).replace('.',',')+' s';$('subtitle').textContent=label.subtitle;$('reference').src='docs/thuong-giao/'+local+'-reference.png';$('reference').alt='Ảnh '+label.name+' do người dùng cung cấp';document.documentElement.style.setProperty('--accent',label.accent);for(const button of document.querySelectorAll('[data-skill]'))button.setAttribute('aria-pressed',String(button.dataset.skill===local));reset();return true;}
 function cast(){if(vfx.effects.length||visual.state?.busy)return {ok:false,reason:'busy'};const result=vfx.cast(skill.id,{caster,weapon:model.group,weaponTip:model.tip,casterHeight:2.35});if(result.ok){castAt=clock;visual.startSpearTechnique(skill.id);const fx=vfx.effects.find(effect=>effect.handle===result.handle);fx.spear.avatarPoseLinked=Number.isFinite(visual.sockets.right.userData.spearTechniqueTime);fx.spear.trace=(a,b,radius)=>BowPiercing.traceWorld(T,a,b,radius,wall.visible?[$('scenario').value==='wall'?closeWall:farWall]:[],()=>0);}render();return result;}
 function render(){if(!vfx||!skill)return;const age=castAt<-90?0:Math.max(0,clock-castAt),state=SpearTechniques.sample(skill.id,age),duration=SpearTechniques.spec(skill.id).duration;const phase=castAt<-90?'Sẵn sàng':age>=duration?'Hoàn tất':state.phase;$('phase').textContent=phase;$('clock').textContent=age.toFixed(2).replace('.',',')+' / '+duration.toFixed(2).replace('.',',')+' s';const hits=targets.reduce((sum,t)=>sum+t.hits,0);$('status').textContent='Trúng bia: '+hits+' lần · '+targets.filter(t=>t.hits>0).length+' bia'+' · Hồi chiêu: '+vfx.cooldownRemaining(skill.id,caster).toFixed(1).replace('.',',')+' s';$('cast').disabled=vfx.cooldownRemaining(skill.id,caster)>0||vfx.effects.length>0;$('pause').textContent=paused?'Tiếp tục':'Tạm dừng';renderer.render(scene,camera);}
 function step(dt){if(!Number.isFinite(dt)||dt<0)return;clock+=dt;visual.update(dt);vfx.update(dt);shake*=Math.exp(-11*dt);cameraPose();render();}
 function cancel(){vfx.cancelAll();visual.cancelSpearTechnique();castAt=-99;shake=0;cameraPose();render();}
 selectSkill(selected);$('cast').onclick=cast;$('reset').onclick=reset;$('cancel').onclick=cancel;$('pause').onclick=()=>{paused=!paused;render();};$('step').onclick=()=>{paused=true;step(.05);};$('quality').onchange=reset;$('scenario').onchange=reset;$('orbit').onchange=()=>{cameraPose();render();};$('gender').onchange=()=>{q.set('gender',$('gender').value);q.set('skill',selected);q.set('quality',$('quality').value);q.set('scenario',$('scenario').value);location.search=q.toString();};for(const button of document.querySelectorAll('[data-skill]')){button.disabled=false;button.onclick=()=>selectSkill(button.dataset.skill);}for(const id of ['cancel','reset','pause','step'])$(id).disabled=false;
 addEventListener('keydown',event=>{if(event.repeat||['INPUT','SELECT','BUTTON'].includes(event.target.tagName))return;if(['Digit1','Digit2','Digit3'].includes(event.code))selectSkill(['xuyen-kich','thuong-phong','pha-tran'][Number(event.code.slice(-1))-1]);if(event.code==='KeyJ')cast();});addEventListener('blur',()=>{paused=true;render();});
 addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);fitCamera();render();});
 window.spearPreview={scene,renderer,camera,actor,visual,reset,cast,cancel,step,selectSkill,render,events,targets,model,grip,get vfx(){return vfx;},get skill(){return skill;},get clock(){return clock;},setCapture(value){document.body.classList.toggle('capture',!!value);},setPaused(value){paused=!!value;render();}};window.ready=true;
 function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!paused&&!document.hidden)step(dt);requestAnimationFrame(frame);}requestAnimationFrame(frame);
}catch(error){$('status').textContent='Chưa mở được bản thử: '+error.message;window.previewError=error.message;console.error(error);}
</script></body></html>
