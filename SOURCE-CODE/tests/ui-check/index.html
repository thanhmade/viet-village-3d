<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kiểm thử giao diện · localhost</title></head>
<body>
<p id="uiCheckBoot">Đang mở trang kiểm thử giao diện…</p>
<script>
// Test fixture only (scripts/ui-check-server.py, 127.0.0.1). Loads the real
// SOURCE-CODE/index.html unchanged except that the Google/Firebase entry module
// is replaced by a fake-UID module. Not reachable through START-GAME or Hosting.
(async function(){
 'use strict';
 if(!['localhost','127.0.0.1','[::1]'].includes(location.hostname)){document.getElementById('uiCheckBoot').textContent='Chỉ dùng trên localhost.';return;}
 const response=await fetch('/SOURCE-CODE/index.html',{cache:'no-store'});
 const html=await response.text(),entry='<script type="module" src="./js/auth-entry.js"></'+'script>';
 if(!html.includes(entry)){document.getElementById('uiCheckBoot').textContent='Không tìm thấy module đăng nhập để thay thế; dừng kiểm thử.';return;}
 const patched=html.replace('<head>','<head><base href="/SOURCE-CODE/index.html">').replace(entry,'<script type="module" src="/SOURCE-CODE/tests/ui-check/ui-check-auth.js"></'+'script>');
 document.open();document.write(patched);document.close();
}());
</script>
</body></html>
