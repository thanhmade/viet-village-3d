<header><p>LÀNG VIỆT 3D / RÌU / TAM THỨC</p><h1><span id="title">Khai Sơn</span><span class="duration" id="duration">3,4 s</span></h1><small id="subtitle">Hạ tấn · nâng rìu · bổ núi · thu thế</small></header>

  <button class="skill" data-skill="pha-giap" aria-pressed="false" disabled><img src="../ASSETS/ui/skills/axe/pha-giap-ember.png" alt=""><span><strong>Phá Giáp</strong><small>2 · 2,8 GIÂY</small></span></button>

<script type="module">
import {GLTFLoader} from '../ASSETS/vendor/gltf-r160/GLTFLoader.js';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),T=window.THREE;
const labels={
 'khai-son':{name:'Khai Sơn',subtitle:'Hạ tấn · nâng rìu · giáng nện · dư chấn mặt đất',accent:'#ebc779'},
 'pha-giap':{name:'Phá Giáp',subtitle:'Vặn hông · chém chéo · phá giáp · thu rìu',accent:'#ffad73'},
 'cuong-phong':{name:'Cuồng Phong',subtitle:'Tụ khí · xoay rìu bốn vòng · phong hỏa cuộn · hồi thế',accent:'#edc477'}
};
try{
 const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');$('reduceMotion').checked=reduced.matches||q.has('reduceMotion');
 const scene=new T.Scene();scene.background=new T.Color('#0d1116');scene.fog=new T.Fog('#0d1116',12,29);
 const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,70);
 function fitCamera(){camera.aspect=innerWidth/innerHeight;camera.fov=T.MathUtils.radToDeg(2*Math.atan(Math.tan(T.MathUtils.degToRad(20))*Math.max(1,1.6/camera.aspect)));camera.updateProjectionMatrix();}fitCamera();
 scene.add(new T.HemisphereLight(0xb9cde1,0x14110f,.62));const key=new T.DirectionalLight(0xffe2b2,8.6);key.position.set(-3,7,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=7;key.shadow.camera.bottom=-5;key.shadow.normalBias=.025;key.shadow.bias=-.0003;scene.add(key);const rim=new T.DirectionalLight(0x8eb7de,1.95);rim.position.set(4,5,-4);scene.add(rim);
 const ground=new T.Mesh(new T.PlaneGeometry(70,70),new T.MeshStandardMaterial({color:0x10151b,roughness:1}));ground.receiveShadow=true;ground.rotation.x=-Math.PI/2;ground.position.y=-.055;scene.add(ground);
 const tiles=new T.InstancedMesh(new T.BoxGeometry(.92,.045,.92),new T.MeshStandardMaterial({color:0x1b222b,roughness:.98,metalness:.02}),357),dummy=new T.Object3D();let tileIndex=0;
 for(let x=-8;x<=8;x++)for(let z=-7;z<=13;z++){dummy.position.set(x*.97,-.028,z*.97);dummy.updateMatrix();tiles.setMatrixAt(tileIndex,dummy.matrix);const grain=.86+(((x+8)*17+(z+7)*31)%11)*.023;tiles.setColorAt(tileIndex,new T.Color().setRGB(grain,grain*.985,grain*.965));tileIndex++;}tiles.receiveShadow=true;scene.add(tiles);
 const borderMat=new T.MeshStandardMaterial({color:0x303b44,roughness:1});
 for(const x of [-7.6,7.6])for(const z of [-4,1,6,11]){const plinth=new T.Mesh(new T.BoxGeometry(.68,.32,.68),borderMat);plinth.position.set(x,.14,z);scene.add(plinth);const post=new T.Mesh(new T.CylinderGeometry(.17,.23,1.45,8),borderMat);post.position.set(x,.95,z);scene.add(post);}
 const actor=new T.Group();scene.add(actor);const gender=q.get('gender')==='female'?'FEMALE':'MALE';$('gender').value=gender.toLowerCase();
 const gltf=await new GLTFLoader().loadAsync('../CHARACTERS/PLAYER/'+gender+'/PLAYER_BASE_'+gender+'_GLB.glb');
 const visual=createVillagePlayerGLTFVisual({THREE:T,gltf,height:2.35,modelId:gender.toLowerCase()+'-base'});actor.add(visual.root);visual.root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});visual.update(0);
 const models=createVillageWeaponModels(T),model=models.models.get('axe'),grip=models.root;for(const item of models.models.values())if(item!==model)item.group.removeFromParent();
 visual.sockets.right.add(grip);grip.scale.setScalar(.7);grip.rotation.y=Math.PI;grip.position.copy(model.gripPoint).multiplyScalar(-.7).applyQuaternion(grip.quaternion);model.group.visible=true;model.group.traverse(o=>{if(o.isMesh)o.castShadow=true;});
 const caster=new T.Object3D();caster.rotation.y=Math.PI;actor.add(caster);
 const closeWall=new T.Box3(new T.Vector3(-3,0,.9),new T.Vector3(3,3,1.1)),farWall=new T.Box3(new T.Vector3(-3,0,3.4),new T.Vector3(3,3,3.6));
 const wall=new T.Mesh(new T.BoxGeometry(6,3,.2),new T.MeshStandardMaterial({color:0x29333e,roughness:.95}));scene.add(wall);
 // Bia và vách là vật thử riêng; không mô phỏng dữ liệu tài khoản hoặc quái thật.
 const targets=[[0,2.2],[-1.5,1.8],[1.5,1.8],[0,-2.2]].map(([x,z],i)=>{const mat=new T.MeshStandardMaterial({color:0x51412d,roughness:.96}),group=new T.Group();group.position.set(x,0,z);const trunk=new T.Mesh(new T.CylinderGeometry(.145,.175,1.85,12),mat);trunk.position.y=.925;group.add(trunk);const arm=new T.Mesh(new T.CylinderGeometry(.052,.052,.70,8),mat);arm.rotation.z=Math.PI/2;arm.position.y=1.25;group.add(arm);const base=new T.Mesh(new T.CylinderGeometry(.29,.35,.1,12),borderMat);base.position.y=.025;group.add(base);scene.add(group);return {id:'axe-preview-target-'+i,point:new T.Vector3(x,0,z),mesh:group,mat,hits:0};});
 let vfx,clock=0,castAt=-99,paused=q.has('test'),last=0,shake=0,skill;const events=[];
 const initial=q.get('skill')?.replace(/^axe\./,'');let selected=labels[initial]?initial:'khai-son';
 if(['low','medium','high'].includes(q.get('quality')))$('quality').value=q.get('quality');
 if([...$('scenario').options].some(o=>o.value===q.get('scenario')))$('scenario').value=q.get('scenario');
 if(q.has('capture'))document.body.classList.add('capture');
 function cameraPose(){if($('orbit').checked){camera.position.set(-10.3,3.45,1.1);camera.lookAt(0,1.65,.7);}else{camera.position.set(-7.4,3.9,7.6);camera.lookAt(0,1.65,.65);}if(!$('reduceMotion').checked)camera.position.y+=Math.sin(clock*49)*shake;}
 function reset(){vfx?.dispose();visual.returnToIdle();visual.update(0);clock=0;castAt=-99;shake=0;events.length=0;const scenario=$('scenario').value;wall.visible=['wall','wall-behind'].includes(scenario);wall.position.set(0,1.5,scenario==='wall'?1:3.5);for(const [i,t] of targets.entries()){t.hits=0;t.mat.color.setHex(0x51412d);t.mesh.visible=scenario==='fan'?i<3:scenario==='rear'?i===3:scenario!=='miss'&&i===0;}vfx=new WeaponVFXCore({THREE:T,scene,quality:$('quality').value,getGroundY:()=>0,onEvent:e=>{events.push({type:e.type,time:clock,hitIndex:e.hitIndex,targetId:e.targetId,contactKind:e.contactKind});if(e.type==='impact'||e.type==='ground-pulse')shake=Math.min(.035,Number(e.shake)||.018);if((e.type==='target-query'||e.type==='hit-window')&&typeof e.testTarget==='function')for(const target of targets)if(target.mesh.visible&&e.testTarget(target.id,target.point,.27,1.85)){target.hits++;target.mat.color.setHex(0x655b49);}}});cameraPose();render();}
 function selectSkill(value){const local=String(value).replace(/^axe\./,'');if(!labels[local])return false;selected=local;skill=AxeSkillConfig.skills.find(item=>item.id==='axe.'+local);const label=labels[local];$('title').textContent=label.name;$('duration').textContent=skill.duration.toFixed(1).replace('.',',')+' s';$('subtitle').textContent=label.subtitle;$('reference').src='../ASSETS/reference/axe/'+local+'-reference.png';$('reference').alt='Ảnh '+label.name+' do người dùng cung cấp';document.documentElement.style.setProperty('--accent',label.accent);for(const button of document.querySelectorAll('[data-skill]'))button.setAttribute('aria-pressed',String(button.dataset.skill===local));reset();return true;}
 function cast(){if(vfx.effects.length||visual.state?.busy)return {ok:false,reason:'busy'};const result=vfx.cast(skill.id,{caster,weapon:model.group,weaponTip:model.tip,casterHeight:2.35});if(result.ok){castAt=clock;visual.startAxeTechnique(skill.id);const fx=vfx.effects.find(effect=>effect.handle===result.handle);fx.axe.avatarPoseLinked=Number.isFinite(visual.sockets.right.userData.axeTechniqueTime);fx.axe.trace=(a,b,radius)=>BowPiercing.traceWorld(T,a,b,radius,wall.visible?[$('scenario').value==='wall'?closeWall:farWall]:[],()=>0);}render();return result;}
 function render(){if(!vfx||!skill)return;const age=castAt<-90?0:Math.max(0,clock-castAt),state=AxeTechniques.sample(skill.id,age),duration=AxeTechniques.spec(skill.id).duration;const phase=castAt<-90?'Sẵn sàng':age>=duration?'Hoàn tất':state.phase;$('phase').textContent=phase;$('timeline').value=Math.min(1,age/duration);$('clock').textContent=age.toFixed(2).replace('.',',')+' / '+duration.toFixed(2).replace('.',',')+' s';const hits=targets.reduce((sum,t)=>sum+t.hits,0);$('status').textContent='Trúng bia: '+hits+' lần · '+targets.filter(t=>t.hits>0).length+' bia'+' · Hồi chiêu: '+vfx.cooldownRemaining(skill.id,caster).toFixed(1).replace('.',',')+' s';$('cast').disabled=vfx.cooldownRemaining(skill.id,caster)>0||vfx.effects.length>0;$('pause').textContent=paused?'Tiếp tục':'Tạm dừng';renderer.render(scene,camera);}
 function step(dt){if(!Number.isFinite(dt)||dt<0)return;clock+=dt;visual.update(dt);vfx.update(dt);shake*=Math.exp(-11*dt);cameraPose();render();}
 function cancel(){vfx.cancelAll();visual.cancelAxeTechnique();castAt=-99;shake=0;cameraPose();render();}
 selectSkill(selected);$('cast').onclick=cast;$('reset').onclick=reset;$('cancel').onclick=cancel;$('pause').onclick=()=>{paused=!paused;render();};$('step').onclick=()=>{paused=true;step(.05);};$('quality').onchange=reset;$('scenario').onchange=reset;$('orbit').onchange=$('reduceMotion').onchange=()=>{cameraPose();render();};$('gender').onchange=()=>{q.set('gender',$('gender').value);q.set('skill',selected);q.set('quality',$('quality').value);q.set('scenario',$('scenario').value);if($('reduceMotion').checked)q.set('reduceMotion','1');else q.delete('reduceMotion');location.search=q.toString();};for(const button of document.querySelectorAll('[data-skill]')){button.disabled=false;button.onclick=()=>selectSkill(button.dataset.skill);}for(const id of ['cancel','reset','pause','step'])$(id).disabled=false;
 addEventListener('keydown',event=>{if(event.repeat||['INPUT','SELECT','BUTTON'].includes(event.target.tagName))return;if(['Digit1','Digit2','Digit3'].includes(event.code))selectSkill(['khai-son','pha-giap','cuong-phong'][Number(event.code.slice(-1))-1]);if(event.code==='KeyJ')cast();});addEventListener('blur',()=>{paused=true;render();});

}catch(error){$('status').textContent='Chưa mở được bản thử: '+error.message;window.previewError=error.message;console.error(error);}
